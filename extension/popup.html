<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; color: #222; }
  #last-url { word-break: break-all; font-size: 11px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { font-size: 13px; margin: 4px 0; color: #555; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
  .warn { color: #b45309; }
  #agent-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
  #agent-box label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  #agent-input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; }
  #agent-save { margin-top: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #busy-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee; }
  #busy-toggle { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 13px; cursor: pointer; font-weight: 600; border-radius: 6px; border: none; }
  #busy-toggle.available { background: #16a34a; color: #fff; }
  #busy-toggle.busy { background: #dc2626; color: #fff; }
  #busy-hint { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Call Screen-Pop</h1>
  <p id="status">Checking...</p>
  <p id="last-call"></p>
  <p id="last-url"></p>

  <div id="busy-box">
    <button id="busy-toggle">Loading...</button>
    <p id="busy-hint"></p>
  </div>

  <div id="agent-box">
    <label for="agent-input">Your agent name (must match CallGear scenario exactly, e.g. "ryhem")</label>
    <input id="agent-input" type="text" placeholder="e.g. ryhem">
    <button id="agent-save">Save</button>
  </div>
<script src="popup.js"></script>
</body>
</html>
