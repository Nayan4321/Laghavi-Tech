<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Corm"; src: url("fonts/CormorantGaramond[wght].ttf"); font-weight: 300 700; }
@font-face { font-family: "Corm"; src: url("fonts/CormorantGaramond-Italic[wght].ttf"); font-weight: 300 700; font-style: italic; }
@font-face { font-family: "Jost"; src: url("fonts/Jost[wght].ttf"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
canvas { position: absolute; left: 0; top: 0; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="reel5.js"></script><script src="islands5.js"></script>
<script>
// EP5 in the Palm Springs reel layout. ?bl=<folder of Blender map frames>  ?border=1 renders only the presenter-window border.
const P = new URLSearchParams(location.search), BL = P.get('bl'), R = window.REEL5;
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = 1080, H = 1920;
const WIN = { x: 714, y: 296, w: 286, h: 286, r: 18 };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), prog = (t, a, d) => clamp((t - a) / d);
const eo = t => 1 - Math.pow(1 - t, 3), back = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let ISL = {};
// camera identical to blender/build_real.py set_cam (pitch / yaw / dist around the target, focal f px, principal point cy)
function camera(c) {
  const yaw = c.yaw * Math.PI / 180, pit = c.pitch * Math.PI / 180, dh = [Math.sin(yaw), Math.cos(yaw), 0];
  const C = [c.x - dh[0] * c.dist * Math.cos(pit), c.y - dh[1] * c.dist * Math.cos(pit), c.dist * Math.sin(pit)];
  let f = [c.x - C[0], c.y - C[1], -C[2]]; const fl = Math.hypot(...f); f = f.map(v => v / fl);
  let r = [f[1], -f[0], 0]; const rl = Math.hypot(...r); r = r.map(v => v / rl);
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  return p => { const v = [p[0] - C[0], p[1] - C[1], (p[2] || 0) - C[2]], z = v[0] * f[0] + v[1] * f[1] + v[2] * f[2];
    return [W / 2 + c.f * (v[0] * r[0] + v[1] * r[1] + v[2] * r[2]) / z, H * c.cy - c.f * (v[0] * u[0] + v[1] * u[1] + v[2] * u[2]) / z, z]; };
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
function path(pr, pts, close) { x.beginPath(); pts.forEach((p, i) => { const s = pr(p); i ? x.lineTo(s[0], s[1]) : x.moveTo(s[0], s[1]); }); if (close) x.closePath(); }
function partial(pts, k) {                        // first k (0..1) of a closed outline, by length
  const L = [0]; for (let i = 1; i <= pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i % pts.length][0] - pts[i - 1][0], pts[i % pts.length][1] - pts[i - 1][1]));
  const end = L[L.length - 1] * k, out = [pts[0]];
  for (let i = 1; i <= pts.length; i++) { if (L[i] <= end) out.push(pts[i % pts.length]); else { const a = pts[i - 1], b = pts[i % pts.length], q = (end - L[i - 1]) / (L[i] - L[i - 1]); out.push([a[0] + (b[0] - a[0]) * q, a[1] + (b[1] - a[1]) * q]); break; } }
  return out;
}
function zone(pr, polys, col, t, at, until) {
  const a = prog(t, at, .35) * (1 - prog(t, until, .4)); if (a <= 0) return;
  const k = eo(prog(t, at, .9));
  x.save(); x.globalAlpha = a; x.lineJoin = 'round'; x.lineCap = 'round';
  for (const P of polys) {
    path(pr, P, true); x.fillStyle = rgba(col, (col === '#ffffff' ? .12 : .34) * eo(prog(t, at + .25, .6))); x.fill();
    path(pr, partial(P, k), false);
    x.shadowColor = rgba(col, 1); x.shadowBlur = 22; x.strokeStyle = rgba(col, 1); x.lineWidth = 6; x.stroke();
    x.shadowBlur = 0; x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 1.6; x.stroke();
  }
  x.restore();
}
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
// ---- Business Bay (EP2) look for all text / info blocks: emerald-black panels, brushed gold, cream type
const BB = { ink: 'rgba(12,22,19,.88)', tile0: 'rgba(20,34,29,.94)', tile1: 'rgba(12,22,19,.90)', line: 'rgba(201,164,106,.55)', cream: '#efe8d8', muted: '#a9a593', gold: '#c9a46a', gold2: '#e6c891' };
function panel(X, Y, w, h, r, hl) {
  const g = x.createLinearGradient(0, Y, 0, Y + h); g.addColorStop(0, hl ? 'rgba(64,52,30,.95)' : BB.tile0); g.addColorStop(1, hl ? 'rgba(30,28,20,.93)' : BB.tile1);
  x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 40; x.shadowOffsetY = 12; x.fillStyle = g; rr(X, Y, w, h, r); x.fill(); x.shadowColor = 'transparent'; x.shadowOffsetY = 0;
  x.strokeStyle = hl ? BB.gold : BB.line; x.lineWidth = hl ? 2.5 : 1.5; x.stroke();
}
function card(pr, C, t) {
  const a = prog(t, C.at, .3) * (1 - prog(t, C.until, .3)); if (a <= 0) return;
  const p = pr([C.x, C.y, 2]); if (p[2] < 0) return;
  const s = .86 + .14 * back(prog(t, C.at, .45)), lift = C.small ? 70 : 120;
  x.save(); x.globalAlpha = a;
  x.strokeStyle = 'rgba(230,200,145,.9)'; x.lineWidth = 2; x.beginPath(); x.moveTo(p[0], p[1]); x.lineTo(p[0], p[1] - lift); x.stroke();
  x.fillStyle = BB.gold2; x.beginPath(); x.arc(p[0], p[1], 7, 0, 6.283); x.fill();
  const ph = ((t - C.at) % 1.4) / 1.4; x.strokeStyle = `rgba(230,200,145,${.9 * (1 - ph)})`; x.lineWidth = 2; x.beginPath(); x.arc(p[0], p[1], 8 + ph * 40, 0, 6.283); x.stroke();
  x.translate(p[0], p[1] - lift); x.scale(s, s);
  x.font = `500 ${C.small ? 21 : 23}px Jost`; x.letterSpacing = '5px'; const tw = x.measureText(C.title.toUpperCase()).width;
  let vw = 0; if (C.value) { x.font = 'italic 500 70px Corm'; x.letterSpacing = '0px'; vw = x.measureText(C.value).width; }
  x.font = 'italic 500 26px Corm'; const gw = C.tag ? x.measureText(C.tag).width + 16 : 0;
  const w = Math.max(tw + gw, vw) + 60, h = C.value ? 150 : 58;
  panel(-w / 2, -h, w, h, C.value ? 22 : 29, false);
  x.textBaseline = 'alphabetic'; x.textAlign = 'center';
  x.font = `500 ${C.small ? 21 : 23}px Jost`; x.letterSpacing = '5px'; x.fillStyle = BB.gold; x.fillText(C.title.toUpperCase(), -gw / 2, -h + (C.value ? 46 : 37));
  if (C.tag) { x.font = 'italic 500 26px Corm'; x.letterSpacing = '0px'; x.fillStyle = BB.muted; x.textAlign = 'left'; x.fillText(C.tag, tw / 2 - gw / 2 + 12, -h + 46); x.textAlign = 'center'; }
  if (C.value) { const va = prog(t, C.valueAt ?? C.at, .35); x.globalAlpha = a * va; x.font = 'italic 500 70px Corm'; x.letterSpacing = '0px'; x.fillStyle = BB.gold2; x.fillText(C.value, 0, -28 + (1 - eo(va)) * 14); }
  x.restore();
}
function stat(S, t) {
  const a = prog(t, S.at, .3) * (1 - prog(t, S.until, .3)); if (a <= 0) return;
  x.save(); x.globalAlpha = a; x.textAlign = 'center'; x.shadowColor = 'rgba(0,0,0,.65)'; x.shadowBlur = 40;
  x.translate(540, S.y + (1 - eo(prog(t, S.at, .5))) * 50);
  x.font = '600 190px Corm'; x.fillStyle = BB.cream; x.fillText(S.text, 0, 0);
  if (S.sub) { x.font = '500 30px Jost'; x.letterSpacing = '8px'; x.fillStyle = BB.gold2; x.fillText(S.sub.toUpperCase(), 0, 64); }
  x.restore();
}
function list(L, t) {
  const a = prog(t, L.at, .3) * (1 - prog(t, L.until, .3)); if (a <= 0) return;
  const w = 880, rowH = 104, h = 130 + L.items.length * rowH, X = 100, Y = 640 - (1 - eo(prog(t, L.at, .4))) * 40;
  x.save(); x.globalAlpha = a; panel(X, Y, w, h, 28, false);
  x.font = 'italic 500 22px Jost'; x.textBaseline = 'middle';
  x.font = '500 22px Jost'; x.letterSpacing = '6px'; x.fillStyle = BB.gold; x.fillText(L.title.toUpperCase(), X + 50, Y + 64); x.letterSpacing = '0px';
  L.items.forEach(([main, sub, at], i) => {
    const yy = Y + 130 + i * rowH + rowH / 2 - 10, on = t >= at, k = eo(prog(t, at, .35));
    x.strokeStyle = 'rgba(201,164,106,.22)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(X + 46, yy - rowH / 2); x.lineTo(X + w - 46, yy - rowH / 2); x.stroke();
    x.strokeStyle = on ? BB.gold2 : 'rgba(201,164,106,.35)'; x.lineWidth = 2.5; x.fillStyle = on ? 'rgba(201,164,106,.18)' : 'transparent'; x.beginPath(); x.arc(X + 70, yy, 22, 0, 6.283); x.fill(); x.stroke();
    if (on) { x.strokeStyle = BB.gold2; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); x.moveTo(X + 59, yy); x.lineTo(X + 59 + 8 * k, yy + 8 * k); x.lineTo(X + 59 + 8 * k + 14 * k, yy - 10 * k); x.stroke(); }
    x.font = '600 50px Corm'; x.fillStyle = on ? BB.cream : 'rgba(239,232,216,.35)'; x.fillText(main, X + 116, yy + (sub ? -14 : 0));
    if (sub) { x.font = '400 28px Jost'; x.fillStyle = on ? BB.muted : 'rgba(169,165,147,.35)'; x.fillText(sub, X + 116, yy + 28); }
  });
  x.restore();
}
function summary(Sm, t) {
  const a = prog(t, Sm.at, .35) * (1 - prog(t, Sm.until, .35)); if (a <= 0) return;
  const X = 70, Y = 560, w = 940, rowH = 82, h = 50 + Sm.rows.length * rowH;
  x.save(); x.globalAlpha = a; panel(X, Y, w, h, 22, false);
  Sm.rows.forEach(([v, l], i) => {
    const k = eo(prog(t, Sm.at + .15 + i * .14, .4)), yy = Y + 25 + i * rowH + rowH / 2; x.globalAlpha = a * k;
    if (i) { x.strokeStyle = 'rgba(239,232,216,.22)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(X + 34, yy - rowH / 2); x.lineTo(X + w - 34, yy - rowH / 2); x.stroke(); }
    x.textBaseline = 'middle'; x.textAlign = 'left'; x.font = '500 58px Corm'; x.fillStyle = BB.cream; x.fillText(v, X + 40 - (1 - k) * 40, yy);
    x.font = '500 28px Jost'; x.letterSpacing = '2px'; x.fillStyle = BB.gold2; x.textAlign = 'right'; x.fillText(l.toUpperCase(), X + w - 40, yy); x.textAlign = 'left'; x.letterSpacing = '0px';
  });
  x.restore();
}
function caption(t) {
  const C = R.CHUNKS.find(c => t >= c.start && t < c.end); if (!C || t < R.MAP_FROM) return;
  const a = prog(t, C.start, .12);
  const parts = C.words.map(w => ({ ...w, font: w.key ? 'italic 500 58px Corm' : '500 42px Jost' }));
  let tw = 0; parts.forEach((p, i) => { x.font = p.font; p.w2 = x.measureText(p.w).width; tw += p.w2 + (i ? 14 : 0); });
  const h = 92, w = tw + 76, X = 540 - w / 2, Y = 1140 - h / 2;
  x.save(); x.globalAlpha = a; x.fillStyle = BB.ink; x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 30; rr(X, Y, w, h, 46); x.fill(); x.shadowColor = 'transparent';
  x.strokeStyle = BB.line; x.lineWidth = 1.5; x.stroke();
  let cx = X + 38; x.textBaseline = 'middle';
  for (const p of parts) { x.font = p.font; x.fillStyle = p.key ? BB.gold2 : BB.cream; x.globalAlpha = a * (t >= p.s - .05 ? 1 : .35); x.fillText(p.w, cx, 1140 + (p.key ? 2 : 1)); cx += p.w2 + 14; }
  x.globalAlpha = a; x.font = '500 20px Jost'; x.letterSpacing = '5px'; const hw = x.measureText(R.HANDLE.toUpperCase()).width + 64;
  x.fillStyle = BB.ink; x.strokeStyle = BB.gold; x.lineWidth = 1.5; rr(540 - hw / 2, 1212, hw, 44, 22); x.fill(); x.stroke();
  x.fillStyle = BB.gold2; x.textAlign = 'center'; x.fillText(R.HANDLE.toUpperCase(), 540 + 2, 1235); x.textAlign = 'left';
  x.restore();
}
function routeDraw(pr, t) {
  const Ro = R.ROUTE, a = prog(t, Ro.at, .2) * (1 - prog(t, Ro.until, .4)); if (a <= 0) return;
  const k = eo(prog(t, Ro.at, Ro.dur)), dense = []; for (let i = 0; i < Ro.pts.length - 1; i++) for (let j = 0; j < 20; j++) { const q = j / 20, p0 = Ro.pts[i], p1 = Ro.pts[i + 1]; dense.push([p0[0] + (p1[0] - p0[0]) * q, p0[1] + (p1[1] - p0[1]) * q]); }
  dense.push(Ro.pts[Ro.pts.length - 1]); const n = Math.max(2, Math.round(dense.length * k)), pts = dense.slice(0, n);
  x.save(); x.globalAlpha = a; x.lineCap = 'round'; x.lineJoin = 'round';
  path(pr, pts, false); x.strokeStyle = 'rgba(230,200,145,.35)'; x.lineWidth = 14; x.shadowColor = BB.gold; x.shadowBlur = 18; x.stroke(); x.shadowBlur = 0;
  path(pr, pts, false); x.strokeStyle = '#f3dca7'; x.lineWidth = 5; x.setLineDash([18, 12]); x.lineDashOffset = -t * 70; x.stroke(); x.setLineDash([]);
  if (k < 1) { const e = pr(pts[pts.length - 1]), b = pr(pts[Math.max(0, pts.length - 4)]); x.translate(e[0], e[1]); x.rotate(Math.atan2(e[1] - b[1], e[0] - b[0])); x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 10;
    x.beginPath(); x.moveTo(26, 0); x.lineTo(-14, -6); x.lineTo(-6, -24); x.lineTo(-12, -24); x.lineTo(-24, -5); x.lineTo(-32, -5); x.lineTo(-36, -14); x.lineTo(-40, -14); x.lineTo(-37, 0); x.lineTo(-40, 14); x.lineTo(-36, 14); x.lineTo(-32, 5); x.lineTo(-24, 5); x.lineTo(-12, 24); x.lineTo(-6, 24); x.lineTo(-14, 6); x.closePath(); x.fill(); }
  x.restore();
}
function beach(pr, t) {
  const B = R.BEACH, a = prog(t, B.at, .2) * (1 - prog(t, B.until, .4)); if (a <= 0) return; const k = eo(prog(t, B.at, B.dur));
  x.save(); x.globalAlpha = a; x.lineJoin = 'round'; x.lineCap = 'round';
  for (const k2 in ISL) for (const P of ISL[k2].polys) { path(pr, partial(P, k), false); x.shadowColor = '#ffe9b0'; x.shadowBlur = 18; x.strokeStyle = 'rgba(243,220,167,.95)'; x.lineWidth = 5; x.stroke(); }
  x.restore();
}
function chrome() {                                    // top bar as in the Business Bay video
  x.save(); x.font = '500 21px Jost'; x.letterSpacing = '6px'; x.textBaseline = 'alphabetic';
  x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 12;
  x.fillStyle = BB.cream; x.textAlign = 'left'; x.fillText('DUBAI SERIES · EP5', 56, 112);
  x.fillStyle = BB.gold2; x.textAlign = 'right'; x.fillText('H&S REAL ESTATE', 1024, 112);
  x.shadowBlur = 0; x.strokeStyle = 'rgba(201,164,106,.5)'; x.lineWidth = 1; x.beginPath(); x.moveTo(56, 128); x.lineTo(1024, 128); x.stroke();
  x.font = '400 15px Jost'; x.letterSpacing = '5px'; x.fillStyle = 'rgba(239,232,216,.7)'; x.fillText('MAP DATA © OPENSTREETMAP · ESRI', 1024, 154);
  x.restore();
}
function hook(t) {                                     // opening headings, Business Bay style (white caps, gold stamp + gold pill)
  const up = (at, d = .5) => eo(prog(t, at, d)), pop = (at, d = .5) => .5 + .5 * back(prog(t, at, d));
  x.save(); x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  let k = up(.55); x.globalAlpha = k; x.font = '700 92px Jost'; x.fillStyle = '#fff'; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 30; x.shadowOffsetY = 6;
  x.fillText('ABU DHABI HAS', 540, 250 + (1 - k) * 60); x.fillText('5 ISLANDS.', 540, 344 + (1 - k) * 60);
  x.shadowColor = 'transparent'; x.shadowOffsetY = 0;
  if (t >= 2.55) { const s = pop(2.55, .45); x.globalAlpha = prog(t, 2.55, .45); x.save(); x.translate(540, 1360); x.rotate(-5 * Math.PI / 180); x.scale(s, s);
    x.font = '500 40px Jost'; x.letterSpacing = '8px'; const w = x.measureText('PLOT TWIST').width + 64; x.fillStyle = 'rgba(10,16,14,.75)'; rr(-w / 2, -40, w, 80, 40); x.fill();
    x.strokeStyle = BB.gold; x.lineWidth = 1.5; x.stroke(); x.fillStyle = '#f3dca7'; x.fillText('PLOT TWIST', 4, 14); x.restore(); }
  if (t >= 3.9) { const s = pop(3.9); x.globalAlpha = prog(t, 3.9, .5); x.save(); x.translate(540, 1500); x.scale(s, s);
    x.font = '700 84px Jost'; const w = x.measureText('SO DOES DUBAI.').width + 68; x.fillStyle = BB.gold; rr(-w / 2, -64, w, 108, 14); x.fill();
    x.fillStyle = '#14100a'; x.fillText('SO DOES DUBAI.', 0, 14); x.restore(); }
  x.restore();
}
function border() {                                   // presenter window frame: gold ring + faint outer line, as in Business Bay
  x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 40; x.shadowOffsetY = 18; x.strokeStyle = BB.gold; x.lineWidth = 3; rr(WIN.x, WIN.y, WIN.w, WIN.h, WIN.r); x.stroke();
  x.shadowColor = 'transparent'; x.strokeStyle = 'rgba(201,164,106,.28)'; x.lineWidth = 1; rr(WIN.x - 10, WIN.y - 10, WIN.w + 20, WIN.h + 20, WIN.r + 8); x.stroke(); x.restore();
}
window.renderAt = async function (t) {
  x.clearRect(0, 0, W, H);
  if (P.get('border')) { border(); return; }
  if (t < R.MAP_FROM) { hook(t); return; }            // his full-frame opening + the hook headings
  const f = Math.round(t * 30), img = BL ? await new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = `${BL}/${String(f).padStart(5, '0')}.png`; }) : null;
  if (img) x.drawImage(img, 0, 0, W, H); else { x.fillStyle = '#2a4a4f'; x.fillRect(0, 0, W, H); }
  const pr = camera(R.camAt(t));
  for (const Z of R.ZONES) zone(pr, Z.k === 'ALL' ? Object.values(ISL).flatMap(o => o.polys) : ISL[Z.k].polys, Z.col, t, Z.at, Z.until);
  beach(pr, t); routeDraw(pr, t);
  for (const C of R.CARDS) card(pr, C, t);
  for (const S of R.STATS) stat(S, t);
  for (const L of R.LISTS) list(L, t);
  summary(R.SUMMARY, t);
  caption(t); chrome();
};
Promise.all([document.fonts.load('700 40px Jost'), document.fonts.load('italic 500 40px Corm')])
  .then(() => { for (const o of window.ISL5) ISL[o.k] = o; window.TOTAL = R.TOTAL; window.READY = true; });
</script></body></html>
