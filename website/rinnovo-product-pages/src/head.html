<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{title}</title>
<style>
:root{--ink:#1d1f23;--mute:#5b6270;--line:#dfe2e8;--soft:#f6f7f9;--ac:#ea580c;--bg:#eef0f4;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eaee;--mute:#a3a9b5;--line:#2c313b;--soft:#1b1f27;--bg:#111318;--card:#171a21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:26px;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 22px;overflow:hidden}
.box__head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.box__head b{font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.box__head small{display:block;color:var(--mute);font-size:13px;text-transform:none;letter-spacing:0;font-weight:400}
button{border:0;border-radius:8px;background:var(--ac);color:#fff;font:600 14px/1 inherit;padding:10px 16px;cursor:pointer;white-space:nowrap}
button.done{background:#16a34a}
.content{padding:18px 20px}
.content h2{font-size:22px;margin:4px 0 10px}
.content h3{font-size:18px;margin:20px 0 6px}
.content p{margin:0 0 12px}
.content ul{margin:0 0 12px;padding-left:22px}
.content li{margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{white-space:nowrap;color:var(--mute);width:1%}
code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:14px}
@media (max-width:600px){.box__head{flex-direction:column;align-items:flex-start}td:first-child{white-space:normal}}
</style>
</head>
