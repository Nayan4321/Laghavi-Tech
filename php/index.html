<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Call Screen-Pop</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 48px auto; padding: 0 16px; color: #222; }
  #status { margin-top: 12px; color: #666; font-size: 14px; }
  button { padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; background: #2563eb; color: white; }
  #call-banner {
    display: none; margin-top: 24px; padding: 16px; border-radius: 8px;
    background: #eef6ff; border: 1px solid #b6dcff;
  }
  #call-banner h2 { margin: 0 0 8px; font-size: 18px; }
  #hint { margin-top: 8px; font-size: 13px; color: #888; }
</style>
</head>
<body>
  <h1>Incoming call screen-pop</h1>
  <div id="status">Waiting for calls...</div>

  <div id="call-banner">
    <h2 id="call-name">Incoming call</h2>
    <div id="call-phone"></div>
    <p><button id="open-btn">Open client profile ↗</button></p>
    <div id="hint"></div>
  </div>

<script>
  const statusEl = document.getElementById('status');
  const banner = document.getElementById('call-banner');
  const callName = document.getElementById('call-name');
  const callPhone = document.getElementById('call-phone');
  const openBtn = document.getElementById('open-btn');
  const hintEl = document.getElementById('hint');
  let currentUrl = null;
  let lastSeen = 0;
  let popupWin = null;

  function showEvent(data) {
    const guest = data.guest;
    callPhone.textContent = 'Caller: ' + data.phone;
    if (guest) {
      callName.textContent = [guest.firstName, guest.lastName].filter(Boolean).join(' ') || 'Client found';
      currentUrl = guest.profileUrl || ('guest.php?id=' + encodeURIComponent(guest.id));
    } else {
      callName.textContent = 'No matching client found';
      currentUrl = null;
    }
    banner.style.display = 'block';
    if (!currentUrl) return;

    if (popupWin && !popupWin.closed) {
      // Already opened once this session: navigate that same window automatically, no click needed.
      popupWin.location.href = currentUrl;
      popupWin.focus();
      hintEl.textContent = '';
    } else {
      // First call this session: needs one click to open (browsers won't let a page open a
      // window with no click at all). That same click arms it for every call after this.
      hintEl.textContent = 'Click below to view — after this first click, future calls open automatically.';
      if (Notification.permission === 'granted') {
        const n = new Notification(callName.textContent, { body: 'Caller: ' + data.phone });
        n.onclick = () => { window.focus(); openProfile(); };
      }
    }
  }

  function openProfile() {
    if (!currentUrl) return;
    popupWin = window.open(currentUrl, 'zenotiProfilePop');
    if (popupWin) hintEl.textContent = '';
  }

  async function poll() {
    try {
      const resp = await fetch('poll.php?since=' + lastSeen);
      const data = await resp.json();
      statusEl.textContent = 'Connected. Waiting for calls.';
      if (data.event) {
        lastSeen = data.event.receivedAt;
        showEvent(data.event);
      }
    } catch (e) {
      statusEl.textContent = 'Connection trouble, retrying...';
    }
  }

  openBtn.onclick = openProfile;

  if (Notification.permission === 'default') Notification.requestPermission();
  poll();
  setInterval(poll, 2500);
</script>
</body>
</html>
